name: Apply direct bone adjust fix

on:
  push:
    branches:
      - fix/bone-adjust-callback-eval2

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'bootstrap direct bone adjust fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: Patch direct evaluated bone transforms
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          tune_path = Path('ogsr_engine/xrGame/player_hud_tune.cpp')
          tune = tune_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          insert_marker = '''void print_bone_adjustment(const shared_str& section, LPCSTR bone_name, const hud_bone_adjustment& adjustment)
          {'''
          direct_helpers = r'''void apply_single_bone_adjustment(IKinematics* model, u16 root_bone_id, const hud_bone_adjustment& adjustment)
          {
              if (!model || root_bone_id == BI_NONE || root_bone_id >= model->LL_BoneCount())
                  return;

              const u16 bone_count = model->LL_BoneCount();
              xr_vector<Fmatrix> before(bone_count);
              for (u16 bone_id = 0; bone_id < bone_count; ++bone_id)
                  before[bone_id].set(model->LL_GetBoneInstance(bone_id).mTransform);

              Fvector rotation_radians = adjustment.rotation;
              rotation_radians.mul(PI / 180.f);

              Fmatrix correction;
              correction.identity();
              correction.rotateX(rotation_radians.x);

              Fmatrix axis_rotation;
              axis_rotation.identity();
              axis_rotation.rotateY(rotation_radians.y);
              correction.mulA_43(axis_rotation);

              axis_rotation.identity();
              axis_rotation.rotateZ(rotation_radians.z);
              correction.mulA_43(axis_rotation);
              correction.translate_over(adjustment.position);

              CBoneInstance& root = model->LL_GetBoneInstance(root_bone_id);
              root.mTransform.mulB_43(correction);
              root.mRenderTransform.mul_43(root.mTransform, model->LL_GetData(root_bone_id).m2b_transform);

              // CalculateBones has already evaluated the whole model. Rebuild every
              // descendant from its PRE-adjustment animated parent-local transform,
              // so moving/rotating a Base Human bone also moves its ValveBiped marker
              // children and any skinned descendants. This is intentionally independent
              // of the bone callback system.
              xr_vector<u8> moved(bone_count, 0);
              moved[root_bone_id] = 1;

              for (u16 pass = 0; pass < bone_count; ++pass)
              {
                  bool progress = false;
                  for (u16 bone_id = 0; bone_id < bone_count; ++bone_id)
                  {
                      if (moved[bone_id])
                          continue;

                      const u16 parent_id = model->LL_GetData(bone_id).GetParentID();
                      if (parent_id == BI_NONE || parent_id >= bone_count || !moved[parent_id])
                          continue;

                      Fmatrix old_parent_inverse, animated_local;
                      old_parent_inverse.invert(before[parent_id]);
                      animated_local.mul_43(old_parent_inverse, before[bone_id]);

                      CBoneInstance& bone = model->LL_GetBoneInstance(bone_id);
                      bone.mTransform.mul_43(model->LL_GetBoneInstance(parent_id).mTransform, animated_local);
                      bone.mRenderTransform.mul_43(bone.mTransform, model->LL_GetData(bone_id).m2b_transform);
                      moved[bone_id] = 1;
                      progress = true;
                  }

                  if (!progress)
                      break;
              }
          }

          u16 bone_depth(IKinematics* model, u16 bone_id)
          {
              u16 depth = 0;
              const u16 bone_count = model ? model->LL_BoneCount() : 0;
              for (u16 step = 0; model && step < bone_count; ++step)
              {
                  const u16 parent_id = model->LL_GetData(bone_id).GetParentID();
                  if (parent_id == BI_NONE || parent_id >= bone_count)
                      break;
                  bone_id = parent_id;
                  ++depth;
              }
              return depth;
          }

          '''
          tune = replace_once(tune, insert_marker, direct_helpers + insert_marker, 'insert direct adjustment helpers')

          namespace_end = '''} // namespace

          bool set_bone_adjust_mode(LPCSTR bone_name)'''
          exported_apply = r'''} // namespace

          void hud_apply_bone_adjustments(IKinematics* model, const shared_str& section, IKinematics* authoritative_source)
          {
              if (!model || !section.c_str())
                  return;

              auto& section_data = bone_adjust_section(section);
              struct resolved_adjustment
              {
                  u16 bone_id{};
                  u16 depth{};
                  const hud_bone_adjustment* adjustment{};
              };

              xr_vector<resolved_adjustment> resolved;
              resolved.reserve(section_data.bones.size());

              for (const auto& [bone_name, adjustment] : section_data.bones)
              {
                  // If the animated item/source owns this exact bone, it was already
                  // adjusted before Source merge. Applying the same correction to the
                  // replacement hand would double it.
                  if (authoritative_source && find_bone_id_ci(authoritative_source, bone_name.c_str()) != BI_NONE)
                      continue;

                  const u16 bone_id = find_bone_id_ci(model, bone_name.c_str());
                  if (bone_id == BI_NONE)
                      continue;

                  resolved.push_back({bone_id, bone_depth(model, bone_id), &adjustment});
              }

              // Parent corrections first, child corrections afterwards. This makes
              // multiple configured bones deterministic and lets child values remain
              // local tweaks on top of an already-adjusted parent chain.
              std::sort(resolved.begin(), resolved.end(), [](const resolved_adjustment& a, const resolved_adjustment& b) {
                  return a.depth < b.depth;
              });

              for (const resolved_adjustment& entry : resolved)
                  apply_single_bone_adjustment(model, entry.bone_id, *entry.adjustment);
          }

          bool set_bone_adjust_mode(LPCSTR bone_name)'''
          tune = replace_once(tune, namespace_end, exported_apply, 'export direct apply function')

          tune = replace_once(
              tune,
              '''    g_bHudAdjustMode = BONE_POS;
              refresh_bone_adjust_callbacks();

              Msg("bone adjust mode: [%s] for [%s]", g_bone_adjust_bone.c_str(), item->m_sect_name.c_str());''',
              '''    g_bHudAdjustMode = BONE_POS;

              Msg("bone adjust mode: [%s] for [%s]", g_bone_adjust_bone.c_str(), item->m_sect_name.c_str());''',
              'remove callback refresh on command')

          tune = replace_once(
              tune,
              '''    // Keep config-defined bone corrections active even while the adjustment UI
              // itself is switched off.
              refresh_bone_adjust_callbacks();

              if (!g_bHudAdjustMode)''',
              '''    if (!g_bHudAdjustMode)''',
              'remove callback refresh on HUD draw')

          tune_path.write_text(tune, encoding='utf-8')

          hud_path = Path('ogsr_engine/xrGame/player_hud.cpp')
          hud = hud_path.read_text(encoding='utf-8')

          hud = replace_once(
              hud,
              '''player_hud* g_player_hud{};''',
              '''// Bone editor corrections are applied to already evaluated skeleton matrices.
          // The implementation lives in player_hud_tune.cpp.
          void hud_apply_bone_adjustments(IKinematics* model, const shared_str& section, IKinematics* authoritative_source = nullptr);

          player_hud* g_player_hud{};''',
              'forward declare direct adjust function')

          old_update = '''    if (m_attached_items[0])
                  m_attached_items[0]->update(true);

              if (m_attached_items[1])
                  m_attached_items[1]->update(true);

              // Item animation is calculated first; the replaceable hands mesh then
              // consumes the common Source-bone transforms through merge callbacks.
              if (m_source_skeletons[0])
              {
                  m_model_kinematics->CalculateBones_Invalidate();
                  m_model_kinematics->CalculateBones(TRUE);
              }
              if (m_source_skeletons[1])
              {
                  m_model_2_kinematics->CalculateBones_Invalidate();
                  m_model_2_kinematics->CalculateBones(TRUE);
              }

              if (script_anim_item_attached && script_anim_item_model)'''

          new_update = '''    if (m_attached_items[0])
              {
                  m_attached_items[0]->update(true);
                  // Apply editor/config correction AFTER the item skeleton has finished
                  // CalculateBones, but BEFORE replacement hands consume it via merge.
                  hud_apply_bone_adjustments(m_attached_items[0]->m_model, m_attached_items[0]->m_sect_name);
              }

              if (m_attached_items[1])
              {
                  m_attached_items[1]->update(true);
                  hud_apply_bone_adjustments(m_attached_items[1]->m_model, m_attached_items[1]->m_sect_name);
              }

              // Item animation is calculated first; the replaceable hands mesh then
              // consumes the already-adjusted Source-bone transforms through merge callbacks.
              if (m_source_skeletons[0])
              {
                  m_model_kinematics->CalculateBones_Invalidate();
                  m_model_kinematics->CalculateBones(TRUE);
              }
              if (m_source_skeletons[1])
              {
                  m_model_2_kinematics->CalculateBones_Invalidate();
                  m_model_2_kinematics->CalculateBones(TRUE);
              }

              // Hand-only/helper bones that do not exist in the authoritative source
              // still need to be editable. Exact source-owned names are skipped here
              // because their correction has already propagated through skeleton merge.
              auto adjust_item_for_hand = [this](u16 idx) -> attachable_hud_item* {
                  if (m_attached_items[idx])
                      return m_attached_items[idx];
                  return m_attached_items[idx ? 0 : 1];
              };

              if (attachable_hud_item* item = adjust_item_for_hand(0))
                  hud_apply_bone_adjustments(m_model_kinematics, item->m_sect_name, m_source_skeletons[0]);
              if (attachable_hud_item* item = adjust_item_for_hand(1))
                  hud_apply_bone_adjustments(m_model_2_kinematics, item->m_sect_name, m_source_skeletons[1]);

              if (script_anim_item_attached && script_anim_item_model)'''

          hud = replace_once(hud, old_update, new_update, 'apply direct adjustments in player_hud update')
          hud_path.write_text(hud, encoding='utf-8')
          PY

          rm -f .github/workflows/apply-direct-bone-adjust-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ogsr_engine/xrGame/player_hud.cpp ogsr_engine/xrGame/player_hud_tune.cpp .github/workflows/apply-direct-bone-adjust-fix.yml
          git commit -m "Apply bone adjustments to evaluated skeleton transforms [ci build]"
          git push origin HEAD:fix/bone-adjust-callback-eval2
