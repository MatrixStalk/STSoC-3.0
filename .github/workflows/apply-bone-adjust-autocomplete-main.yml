name: Apply all-bones bone-adjust patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'bootstrap all-bones autocomplete patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: Patch player_hud_tune.cpp
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('ogsr_engine/xrGame/player_hud_tune.cpp')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(r'attachable_hud_item\* bone_adjust_item_for_index\(u16 idx\)\n\{.*?\n\}\n\nvoid BoneAdjustCallback', re.S)
          replacement = '''attachable_hud_item* bone_adjust_item_for_index(u16 idx)
          {
              if (!g_player_hud)
                  return nullptr;

              // Generic HUD bone adjustment: no dependency on Source merge or
              // on any particular bone naming convention.
              if (auto item = g_player_hud->attached_item(idx))
                  return item;

              const u16 other_idx = idx ? 0 : 1;
              return g_player_hud->attached_item(other_idx);
          }

          u16 find_bone_id_ci(IKinematics* model, LPCSTR bone_name)
          {
              if (!model || !bone_name || !bone_name[0])
                  return BI_NONE;

              const u16 direct = model->LL_BoneID(bone_name);
              if (direct != BI_NONE)
                  return direct;

              const u16 count = model->LL_BoneCount();
              for (u16 id = 0; id < count; ++id)
              {
                  LPCSTR candidate = model->LL_BoneName(id);
                  if (candidate && !_stricmp(candidate, bone_name))
                      return id;
              }
              return BI_NONE;
          }

          void append_model_bone_tips(IKinematics* model, IConsole_Command::vecTips& tips)
          {
              if (!model)
                  return;

              const u16 count = model->LL_BoneCount();
              for (u16 id = 0; id < count; ++id)
              {
                  LPCSTR bone_name = model->LL_BoneName(id);
                  if (!bone_name || !bone_name[0])
                      continue;

                  bool duplicate = false;
                  for (const shared_str& tip : tips)
                  {
                      if (!_stricmp(tip.c_str(), bone_name))
                      {
                          duplicate = true;
                          break;
                      }
                  }

                  if (!duplicate)
                      tips.emplace_back(bone_name);
              }
          }

          void BoneAdjustCallback'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'failed to replace bone_adjust_item_for_index: {count}')

          text, count = re.subn(r'const u16 bone_id = model->LL_BoneID\(bone_name\);',
                                'const u16 bone_id = find_bone_id_ci(model, bone_name.c_str());', text, count=1)
          if count != 1:
              raise SystemExit(f'failed to replace callback bone lookup: {count}')

          text, count = re.subn(
              r'\s*const BoneCallback original = bone\.callback\(\);\n\s*if \(!original \|\| original == BoneAdjustCallback\)\n\s*continue;\n\n\s*bone_adjust_callback_context context;\n\s*context\.original_callback = original;\n\s*context\.original_param = bone\.callback_param\(\);',
              '''\n            const BoneCallback original = bone.callback();

            bone_adjust_callback_context context;
            context.original_callback = original == BoneAdjustCallback ? nullptr : original;
            context.original_param = original == BoneAdjustCallback ? nullptr : bone.callback_param();''',
              text, count=1)
          if count != 1:
              raise SystemExit(f'failed to replace callback guard: {count}')

          old = 'Msg("! bone_adjust_mode: no HUD item with skeleton_merge is attached");'
          if old not in text:
              raise SystemExit('old skeleton_merge error message not found')
          text = text.replace(old, 'Msg("! bone_adjust_mode: no HUD item is attached");', 1)

          old = 'const u16 bone0 = g_player_hud->Model() ? g_player_hud->Model()->LL_BoneID(normalized.c_str()) : BI_NONE;'
          if old not in text:
              raise SystemExit('bone0 lookup not found')
          text = text.replace(old, 'const u16 bone0 = find_bone_id_ci(g_player_hud->Model(), normalized.c_str());', 1)

          old = 'const u16 bone1 = g_player_hud->Model2() ? g_player_hud->Model2()->LL_BoneID(normalized.c_str()) : BI_NONE;'
          if old not in text:
              raise SystemExit('bone1 lookup not found')
          text = text.replace(old, 'const u16 bone1 = find_bone_id_ci(g_player_hud->Model2(), normalized.c_str());', 1)

          old = '''    g_bHudAdjustItemIdx = item_idx;
              g_bone_adjust_bone = normalized.c_str();'''
          if old not in text:
              old = '''    g_bHudAdjustItemIdx = item_idx;
    g_bone_adjust_bone = normalized.c_str();'''
          new = '''    LPCSTR resolved_bone_name = normalized.c_str();
          if (bone0 != BI_NONE && g_player_hud->Model())
              resolved_bone_name = g_player_hud->Model()->LL_BoneName(bone0);
          else if (bone1 != BI_NONE && g_player_hud->Model2())
              resolved_bone_name = g_player_hud->Model2()->LL_BoneName(bone1);

          g_bHudAdjustItemIdx = item_idx;
          g_bone_adjust_bone = resolved_bone_name;'''
          if old not in text:
              raise SystemExit('selected bone assignment block not found')
          text = text.replace(old, new, 1)

          info_pattern = re.compile(r'    void Info\(TInfo& info\) override\n    \{\n        strcpy_s\(info, "adjust HUD hands bone: bone_adjust_mode <bone_name\|off>"\);\n    \}')
          info_replacement = '''    void Info(TInfo& info) override
              {
                  strcpy_s(info, "adjust any HUD hands bone: bone_adjust_mode <bone_name|off>");
              }

              void fill_tips(vecTips& tips, u32 mode) override
              {
                  add_LRU_to_tips(tips);

                  bool has_off = false;
                  for (const shared_str& tip : tips)
                  {
                      if (!_stricmp(tip.c_str(), "off"))
                      {
                          has_off = true;
                          break;
                      }
                  }
                  if (!has_off)
                      tips.emplace_back("off");

                  if (!g_player_hud)
                      return;

                  // Runtime enumeration means ValveBiped, Base Human and any
                  // custom rig names all appear automatically in console tips.
                  append_model_bone_tips(g_player_hud->Model(), tips);
                  append_model_bone_tips(g_player_hud->Model2(), tips);
              }'''
          text, count = info_pattern.subn(info_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'failed to add fill_tips: {count}')

          old = 'Msg("SHIFT+NUM0 exit | SHIFT+NUM1 position | SHIFT+NUM2 rotation | SHIFT+NUM8 pos step | SHIFT+NUM9 rot step");'
          if old in text:
              text = text.replace(old, 'Msg("SHIFT+0 exit | SHIFT+1 position | SHIFT+2 rotation | SHIFT+8 pos step | SHIFT+9 rot step");', 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/apply-bone-adjust-autocomplete-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ogsr_engine/xrGame/player_hud_tune.cpp .github/workflows/apply-bone-adjust-autocomplete-main.yml
          git commit -m "Bone adjust all HUD bones + console autocomplete [ci build]"
          git push origin HEAD:main
